<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 680" fill="none" role="img" aria-label="FlintPHP Official Logo">
  <defs>
    <linearGradient id="logoLightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C" />
      <stop offset="35%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Rock Symbol scaled & positioned on left -->
  <g transform="translate(-140, -160) scale(1)">
    <!-- Flint Shards (Color: #0A0A0A / deep obsidian black) -->
    <g fill="#0A0A0A">
      <polygon points="494,172 396,346 443,414 494,172" />
      <polygon points="390,360 376,498 450,568 444,428" />
      <polygon points="378,512 402,652 463,726 452,582" />
      <polygon points="405,668 474,822 466,738" />
      <polygon points="586,450 600,488 556,696 504,672 500,642 554,490" />
      <polygon points="508,686 552,706 488,822 482,780 488,690" />
    </g>
    <!-- Sparks -->
    <g fill="url(#logoLightningGrad)">
      <polygon points="560,196 570,228 560,260 550,228" />
      <polygon points="606,268 626,292 616,320 596,294" />
      <polygon points="602,198 578,348 624,345 494,638 518,465 544,420 514,332" />
    </g>
  </g>

  <!-- Wordmark 'FlintPHP' in deep obsidian stone (#0A0A0A) -->
  <text x="560" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="280" font-weight="800" letter-spacing="-0.03em" fill="#0A0A0A">
    Flint<tspan font-weight="900" fill="#EA580C">PHP</tspan>
  </text>
</svg>